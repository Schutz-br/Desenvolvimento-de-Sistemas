<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <header>
        <h1>🪙Conversor do Tião🪙</h1>
    </header>
    <main>
        <div id="c">
            <form>

                <div class="campo">
                    <label for="sel">Selecione o tipo de moeda</label>
                    <select id="sel">
                        <option value="" selected disabled>Selecione</option>
                        <option value="1">1- €$- Euro</option>
                        <option value="2">2- U$- Dolár</option>
                        <option value="3">3- ARS$- Pesos Argentinos</option>
                        <option value="4">4- Kz$- Kwanza</option>
                        <option value="5">5- ¥$- Iene</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="valor">Digite o valor</label>
                    <input type="number" id="valor" placeholder="Digite o valor"  min="0" step="0.01">
                </div>
                <div id="res"></div>

                <button id="btnabrir" type="button">Converter</button>
                <div id="modal" class="modal-overlay hidden">
                    <div class="modal-box">
                        <h3>Escolha uma opção</h3>
                        <button id="op1" type="button" onclick="real()">Converter para R$</button>
                        <button id="op2" type="button" onclick="converter()">converter de R$</button>
                        <button id="cancel" type="button">Cancelar</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; Todos os direitos reservados</p>
    </footer>

</body>

</html>
